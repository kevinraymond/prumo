<svg xmlns="http://www.w3.org/2000/svg" width="860" height="454" viewBox="0 0 860 454" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
<title>Package load times on pdfLaTeX and LuaLaTeX</title><desc>The standard document&#x27;s slowest packages and classes, exclusive time on pdfLaTeX (hollow) and LuaLaTeX (filled), sorted by how much longer LuaLaTeX takes.</desc>
