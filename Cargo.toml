[package]
name = "prumo"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Build analyzer for LaTeX: timing per package, which package loaded which, fonts, and the TeX Live packages a document needs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kevinraymond/prumo"
readme = "README.md"
keywords = ["latex", "tex", "texlive", "profiler", "build"]
categories = ["command-line-utilities", "development-tools::profiling"]

[[bin]]
name = "prumo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]

[features]
default = []
# Run the fixtures through a real TeX engine (needs TeX Live + poppler-utils).
tex = []

[lints.rust]
unsafe_code = "forbid"
